name: Build Pokemon World GBA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get Pokemon World source
        uses: actions/checkout@v4
        with:
          repository: evilchinesefood/PKMN-World
          path: pokemon-world

      - name: Install GBA build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi libpng-dev python3 git

      - name: Build ROM
        working-directory: pokemon-world
        run: |
          touch .histignore
          make modern -j$(nproc)
          test -f pokemonworld.gba
          ls -lh pokemonworld.gba

      - name: Upload pokemonworld.gba
        uses: actions/upload-artifact@v4
        with:
          name: pokemonworld-gba
          path: pokemon-world/pokemonworld.gba
          if-no-files-found: error
